<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ストロングシステム 社員名簿</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <header class="hero">
        <p class="eyebrow">STRONG SYSTEM / Day 2</p>
        <h1>社員名簿</h1>
        <section id="badge" class="badge badge-unknown" aria-live="polite">
            <div class="badge-label">接続先</div>
            <div class="badge-source" id="badge-source">確認中…</div>
            <div class="badge-host" id="badge-host"></div>
            <div class="badge-meta" id="badge-meta"></div>
        </section>
        <p id="error" class="error" hidden></p>
    </header>

    <main class="panel">
        <div class="toolbar">
            <div class="count"><span id="count">0</span> 名</div>
            <button class="btn btn-primary" data-action="open-create">＋ 社員を追加</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>社員番号</th>
                        <th>氏名</th>
                        <th>部署</th>
                        <th>役職</th>
                        <th>メール</th>
                        <th>入社日</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <dialog id="editor">
        <form id="editor-form" method="dialog">
            <h2 id="editor-title">社員を追加</h2>
            <div class="grid">
                <label>社員番号 *<input name="employee_id" maxlength="20" required></label>
                <label>部署 *<input name="department" maxlength="50" required></label>
                <label>姓 *<input name="last_name" maxlength="50" required></label>
                <label>名 *<input name="first_name" maxlength="50" required></label>
                <label class="wide">メール *<input name="email" type="email" maxlength="100" required></label>
                <label>役職<input name="position" maxlength="50"></label>
                <label>入社日<input name="hire_date" type="date"></label>
            </div>
            <p id="editor-error" class="error" hidden></p>
            <div class="actions">
                <button type="button" class="btn" data-action="close-editor">キャンセル</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
